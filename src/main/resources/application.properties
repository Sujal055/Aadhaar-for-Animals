spring.application.name=aadhaarstrays
# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── MySQL Database ───────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/aadhaar_strays_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Sujal@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=AadhaarStraysSecretKey2025MaharashtraInitiativeVeryLongSecretForHS256Signing
app.jwt.expiration-ms=86400000

# ─── CORS (React dev server) ──────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ─── Multipart (photo uploads) ────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/photos

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.aadhaarstrays=INFO
logging.level.org.springframework.security=WARN